name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `git tm` in ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: git-tm version
      description: Output of `git tm -v`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Node 22.12, git 2.47, Windows 11, Firefox 133
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal output or browser console errors
      render: text
